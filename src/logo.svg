      <rect x="34" y="32" width="60" height="16"/>
      <polygon points="18,40 38,24 38,56"/>
      <polygon points="110,40 90,24 90,56"/>
    </g>
  </g>

  <!-- Tipografia TextSwitch -->
  <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
